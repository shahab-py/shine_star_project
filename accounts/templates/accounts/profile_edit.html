{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow rounded-4 overflow-hidden">
                <!-- هدر فرم -->
                <div class="card-header bg-primary py-4 text-center border-0">
                    <h3 class="text-white mb-0">ویرایش اطلاعات پروفایل</h3>
                    <p class="text-white-50 small mt-2">تغییرات شما پس از ذخیره اعمال خواهد شد</p>
                </div>

                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <!-- فیلد غیرقابل تغییر نام کاربری -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small">نام کاربری</label>
                            <input type="text" class="form-control" value="{{ user.username }}" disabled>
                        </div>

                        <hr>

                        <!-- رندر خودکار فیلدهای فرم -->
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-bold text-muted small">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger small mt-1">
                                        {{ field.errors }}
                                    </div>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <!-- دکمه‌ها -->
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary rounded-pill py-2">ذخیره تغییرات</button>
                            <a href="{% url 'accounts:profile' %}" class="btn btn-light text-muted rounded-pill py-2">انصراف و بازگشت</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
