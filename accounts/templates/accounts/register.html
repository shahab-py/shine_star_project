{% extends 'base.html' %}

{% block title %}ثبت‌نام | Shine Star{% endblock %}

{% block extra_css %}
<style>
    /* استایل‌های اختصاصی برای کوچک و ظریف کردن فرم */
    .auth-card {
        border: none;
        border-radius: 15px;
        padding: 25px 20px; /* کاهش پدینگ برای کوتاهی ارتفاع */
        background: #ffffff;
    }

    .auth-card h3 {
        font-size: 1.25rem; /* کوچک کردن عنوان */
        font-weight: 700;
        margin-bottom: 20px;
        color: #333;
    }

    /* استایل فیلدها */
    .form-floating {
        margin-bottom: 15px; /* کاهش فاصله بین فیلدها برای کوتاه شدن ارتفاع */
    }

    .form-control {
        border-radius: 10px;
        border: 1px solid #eee;
        font-size: 0.9rem; /* کوچک کردن متن ورودی */
        padding: 0.75rem 0.75rem;
    }

    /* محو کردن متن‌های کمکی (Placeholder) */
    .form-control::placeholder {
        color: rgba(0, 0, 0, 0.2) !important; /* بسیار محو */
        font-size: 0.85rem;
    }

    /* استایل دکمه */
    .btn-auth {
        width: 100%;
        border-radius: 10px;
        padding: 10px;
        font-weight: 600;
        font-size: 0.9rem;
        margin-top: 10px;
    }

    /* کوچک کردن آیکون چشم در پسورد */
    .password-toggle-icon {
        font-size: 0.85rem;
        color: rgba(0, 0, 0, 0.3);
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <!-- تغییر به col-lg-3 برای کوچک‌ترین عرض ممکن در مانیتورهای بزرگ -->
        <div class="col-12 col-sm-8 col-md-5 col-lg-3">
            
            <div class="card auth-card shadow-sm">
                <div class="card-body text-center">
                    <h3>عضویت</h3>
                    
                    <form method="post" action="{% url 'accounts:register' %}">
                        {% csrf_token %}

                        <!-- فیلد نام کاربری -->
                        <div class="form-floating"> 
                            <input type="text" name="username" class="form-control" id="username" required>
                            <label for="username" style="color: rgba(0,0,0,0.4);">نام کاربری</label>   
                        </div>

                        <!-- فیلد ایمیل -->
                        <div class="form-floating">
                            <input type="email" name="email" class="form-control" id="email" required>
                            <label for="email" style="color: rgba(0,0,0,0.4);">ایمیل</label>
                        </div>

                        <!-- فیلد پسورد -->
                        <div class="form-floating input-group">
                            <input type="password" name="password" class="form-control" id="password" required>
                            <label for="password" style="color: rgba(0,0,0,0.4);">رمز عبور</label>
                            <span class="input-group-text bg-transparent border-0" onclick="togglePassword('password')">
                                <i class="bi bi-eye password-toggle-icon" id="eye-icon-password"></i>
                            </span>
                        </div>

                        <!-- فیلد تایید پسورد -->
                        <div class="form-floating input-group">
                            <input type="password" name="confirm_password" class="form-control" id="confirm_password" required>
                            <label for="confirm_password" style="color: rgba(0,0,0,0.4);">تکرار رمز عبور</label>
                            <span class="input-group-text bg-transparent border-0" onclick="togglePassword('confirm_password')">
                                <i class="bi bi-eye password-toggle-icon" id="eye-icon-confirm_password"></i>
                            </span>
                        </div>

                        <button type="submit" class="btn btn-primary btn-auth shadow-sm">ساخت حساب</button>
                    </form>

                    <div class="mt-3">
                        <p class="small text-muted">قبلاً عضو شده‌ای؟ <a href="{% url 'accounts:login' %}" class="text-decoration-none">وارد شوید</a></p>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function togglePassword(fieldId) {
        const passwordField = document.getElementById(fieldId);
        const icon = document.getElementById('eye-icon-' + fieldId);
        
        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            passwordField.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>
{% endblock %}
