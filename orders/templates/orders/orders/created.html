{% "extends base.html" %}

{% block content %}
<div class="container mt-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-success shadow">
                <div class="card-body">
                    <div class="display-1 text-success mb-4">
                        <i class="bi bi-check-circle-fill"></i> ✅
                    </div>
                    <h2 class="card-title">سفارش شما با موفقیت ثبت شد!</h2>
                    <p class="card-text mt-3">
                        ممنون از اعتماد شما به <strong>Shine Star</strong>. 
                        اطلاعات سفارش به ایمیل شما ارسال خواهد شد.
                    </p>
                    <hr>
                    <div class="d-grid gap-2">
                        <a href="{% url 'shop:product_list' %}" class="btn btn-primary">ادامه خرید</a>
                        <a href="{% url 'shop:home' %}" class="btn btn-outline-secondary">بازگشت به صفحه اصلی</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
