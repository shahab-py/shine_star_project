<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shine Star | فروشگاه آنلاین{% endblock %}</title>
    
    <!-- Bootstrap CSS (نسخه 5) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <!-- فونت فارسی (اختیاری اما برای زیبایی لازم است) -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: bold;
            color: #ffd700 !important; /* رنگ طلایی برای Shine Star */
        }
    </style>
</head>
<body>

    <!-- نوار ناوبری (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand" href="#">✨ Shine Star</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href = {% url "home" %} class="nav-link active" href="#">خانه</a></li>
                    <li class="nav-item"><a href = {% url "product_list" %} class="nav-link" href="#">محصولات</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">درباره ما</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">تماس با ما</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- محتوای اصلی که هر صفحه تغییر می‌کند -->
    <main class="container mt-4">
        {% block content %}
        <!-- اینجا محتوای صفحات دیگر قرار می‌گیرد -->
        {% endblock %}
    </main>

    <!-- فوتر (Footer) -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>© 2026 Shine Star - تمامی حقوق محفوظ است</p>
    </footer>

    <!-- Bootstrap JS Bundle (مهم برای کارکرد منوهای بازشونده و مودال‌ها) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
